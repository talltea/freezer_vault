<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freezer Vault</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f6f9;
      --card: #ffffff;
      --text: #1b2430;
      --muted: #6a7684;
      --border: #dce3ea;
      --accent: #2b74c9;
      --old: #b9480f;
      --old-bg: #fff3eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161c;
        --card: #1a212a;
        --text: #e5ecf2;
        --muted: #8a97a5;
        --border: #2b3541;
        --accent: #5c9fe8;
        --old: #f39a5b;
        --old-bg: #2a1e16;
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { font-size: clamp(1.25rem, 6.5vw, 1.5rem); margin: 0; white-space: nowrap; }
    .backup { display: flex; flex: none; gap: 6px; font-size: 0.85rem; }

    input, select, button { font: inherit; color: inherit; }
    input, select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      min-width: 0;
    }
    button { cursor: pointer; }
    .link {
      background: none;
      border: 0;
      padding: 4px;
      color: var(--accent);
      text-decoration: underline;
    }

    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
    .tabs button, .tab-menu {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 999px;
      padding: 6px 14px;
    }
    .tabs button[aria-pressed="true"], .tab-menu {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .tabs .new { background: none; border-style: dashed; color: var(--muted); }
    /* The open freezer's tab is also its Rename/Delete menu. */
    .tab-menu { position: relative; cursor: pointer; }
    .tab-menu::after { content: " ▾"; font-weight: normal; }

    #summary { color: var(--muted); margin: 10px 0 12px; min-height: 1.4em; }

    .add {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .add .row { display: flex; gap: 8px; }
    #category, #freezer, #added { flex: 1; }
    #qty { width: 72px; }
    .add button {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 600;
    }

    #search { width: 100%; margin: 20px 0 10px; background: var(--card); }

    #list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
    }
    .group {
      margin: 12px 4px 0;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .group:first-child { margin-top: 0; }
    .item {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .item.old { background: var(--old-bg); }
    .item.old .meta { color: var(--old); }
    .name { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
    /* A full-width line under the name: dates, then the freezer and category dropdowns. */
    .meta {
      flex-basis: 100%;
      min-width: 0;
      padding-left: 32px; /* lines up under the name, past the checkbox */
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 2px 14px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .drop { position: relative; max-width: 100%; color: var(--accent); }
    .drop::after { content: " ▾"; }
    .drop:hover span { text-decoration: underline; }
    .drop:focus-within, .tab-menu:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* An invisible native select over the text: phones get their own picker,
       and 16px text stops iOS from zooming in when it's tapped. */
    .drop select, .tab-menu select {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      font-size: 16px;
      padding: 0;
      border: 0;
      cursor: pointer;
    }
    .qty { display: flex; align-items: center; gap: 6px; }
    .qty button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 1.2rem;
      line-height: 1;
    }
    .qty .n {
      width: 3em;
      padding: 4px 2px;
      background: none;
      border-radius: 6px;
      text-align: center;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .qty .n:focus { outline: none; border-color: var(--accent); background: var(--bg); }

    /* Ticking any item brings up the bulk bar. The label pads the checkbox
       out to a finger-sized target without taking more room in the card. */
    .check-hit { display: flex; flex: none; padding: 10px; margin: -10px; cursor: pointer; }
    .check { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); cursor: pointer; }
    body.has-selection main { padding-bottom: 120px; }
    .item.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .bulk {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 16px;
      background: var(--card);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 16px rgb(0 0 0 / 0.08);
    }
    .bulk-inner {
      max-width: 528px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      font-size: 0.9rem;
    }
    #selected-count { margin-right: auto; color: var(--muted); }
    .bulk button { background: none; border: 0; padding: 4px; color: var(--accent); }
    .bulk #bulk-remove { color: var(--old); }
    .bulk #bulk-clear { color: var(--muted); }

    #empty { color: var(--muted); text-align: center; padding: 32px 0; }

    footer { margin-top: 40px; font-size: 0.85rem; color: var(--muted); text-align: center; }
    .categories { margin-top: 10px; font-size: 0.85rem; color: var(--muted); }
    .categories summary { cursor: pointer; width: fit-content; }
    .categories p { margin: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 8px; }
    .chip {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
    }
    .chip button { background: none; border: 0; padding: 5px 4px 5px 12px; }
    .chip .remove { padding: 5px 10px 5px 4px; color: var(--muted); }
    .chips .new {
      background: none;
      border: 1px dashed var(--border);
      border-radius: 999px;
      padding: 5px 12px;
    }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <h1>🧊 Freezer Vault</h1>
      <div class="backup">
        <button id="export" class="link" type="button" title="Download a backup file">Export</button>
        <button id="import" class="link" type="button" title="Load a backup file">Import</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
      </div>
    </header>

    <div class="tabs" id="tabs">
      <button id="add-freezer" class="new" type="button">+ Freezer</button>
    </div>

    <p id="summary"></p>

    <form class="add" autocomplete="off">
      <input id="name" placeholder="What's going in?" aria-label="Item name" required>
      <div class="row">
        <select id="category" aria-label="Category"></select>
        <select id="freezer" aria-label="Which freezer"></select>
      </div>
      <div class="row">
        <input id="qty" inputmode="decimal" value="1" aria-label="Quantity">
        <input id="added" type="date" aria-label="Date frozen">
        <button type="submit">Add</button>
      </div>
    </form>

    <details class="categories">
      <summary>Edit categories</summary>
      <div class="chips" id="category-chips">
        <button id="add-category" class="new" type="button">+ New category</button>
      </div>
      <p>Tap a category to rename it, or × to delete it.</p>
    </details>

    <input id="search" type="search" placeholder="Search…" aria-label="Search">
    <ul id="list"></ul>
    <p id="empty" hidden></p>

    <footer>
      Saved in this browser only. Use Export at the top to keep a backup.
    </footer>

    <div class="bulk" id="bulk" hidden>
      <div class="bulk-inner">
        <span id="selected-count"></span>
        <label class="drop"><span>Category</span><select id="bulk-category" aria-label="Set category for selected"></select></label>
        <label class="drop"><span>Move</span><select id="bulk-move" aria-label="Move selected to freezer"></select></label>
        <button id="bulk-remove" type="button">Remove</button>
        <button id="bulk-clear" type="button">Clear</button>
      </div>
    </div>
  </main>

  <template id="row">
    <li class="item">
      <label class="check-hit"><input class="check" type="checkbox"></label>
      <div class="name"></div>
      <div class="qty">
        <button class="dec" type="button" aria-label="Use one">−</button>
        <input class="n" inputmode="decimal">
        <button class="inc" type="button" aria-label="Add one">+</button>
      </div>
      <div class="meta">
        <span class="details"></span>
        <label class="drop"><span></span><select class="freezer-pick" aria-label="Freezer"></select></label>
        <label class="drop"><span></span><select class="category-pick" aria-label="Category"></select></label>
      </div>
    </li>
  </template>

  <template id="chip">
    <span class="chip"><button class="rename" type="button"></button><button class="remove" type="button">×</button></span>
  </template>

  <script>
    const STORAGE_KEY = 'freezer-vault';
    const VIEW_KEY = 'freezer-vault-view';
    const OLD_AFTER_DAYS = 90;
    const DEFAULT_CATEGORIES = [
      'Bread & baked goods', 'Dessert', 'Fruits & veggies', 'Ingredients',
      'Nuts', 'Prepared foods', 'Raw meat', 'Seafood',
    ];

    const tabs = document.getElementById('tabs');
    const addFreezerButton = document.getElementById('add-freezer');
    const summary = document.getElementById('summary');
    const form = document.querySelector('.add');
    const nameInput = document.getElementById('name');
    const categorySelect = document.getElementById('category');
    const freezerSelect = document.getElementById('freezer');
    const qtyInput = document.getElementById('qty');
    const dateInput = document.getElementById('added');
    const search = document.getElementById('search');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const categoryChips = document.getElementById('category-chips');
    const addCategoryButton = document.getElementById('add-category');
    const rowTemplate = document.getElementById('row');
    const chipTemplate = document.getElementById('chip');
    const importFile = document.getElementById('import-file');
    const bulkBar = document.getElementById('bulk');
    const selectedCount = document.getElementById('selected-count');
    const bulkCategory = document.getElementById('bulk-category');
    const bulkMove = document.getElementById('bulk-move');
    const bulkRemove = document.getElementById('bulk-remove');
    const newCategoryOption = new Option('+ New category…');

    let { freezers, categories, items } = load();
    let current = loadView(); // a freezer id, or 'all'
    let formCategory = ''; // kept so picking "+ New category…" can be cancelled
    const selected = new Set(); // ids of the ticked items

    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (data) return normalize(data);
      } catch {}
      return normalize({ items: [] });
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ freezers, categories, items }));
      } catch {}
      render();
    }

    // The open freezer tab is remembered in this browser, so a refresh lands on it again.
    function loadView() {
      try {
        return localStorage.getItem(VIEW_KEY) || 'all';
      } catch {
        return 'all';
      }
    }

    function setCurrent(id) {
      current = id;
      try {
        localStorage.setItem(VIEW_KEY, id);
      } catch {}
    }

    // Cleans up saved data or a backup file, filling in anything left out so
    // backups are easy to write by hand. Only item names are required. The
    // first version stored a plain list of items with no freezers.
    function normalize(data) {
      if (Array.isArray(data)) data = { items: data };
      if (!data || !Array.isArray(data.items)) throw new Error('not freezer data');

      const freezers = (Array.isArray(data.freezers) ? data.freezers : [])
        .filter(f => f && typeof f.name === 'string' && f.name.trim())
        .map(f => ({ id: typeof f.id === 'string' ? f.id : newId(), name: f.name.trim() }));
      if (!freezers.length) freezers.push({ id: newId(), name: 'Main freezer' });

      // No category list (older saves, or left out of a backup) means the defaults.
      const categories = [];
      for (const c of Array.isArray(data.categories) ? data.categories : DEFAULT_CATEGORIES) {
        if (typeof c === 'string' && c.trim() && !categoryFor(c)) categories.push(c.trim());
      }
      categories.sort(byName);

      // Items can point at a freezer by id or by name (any capitalization).
      // A missing or misspelled freezer means the first one.
      function freezerFor(ref) {
        const name = String(ref ?? '').trim().toLowerCase();
        const freezer = freezers.find(f => f.id === ref) ||
          freezers.find(f => f.name.toLowerCase() === name) ||
          freezers[0];
        return freezer.id;
      }

      // Categories match by name (any capitalization); anything else means none.
      function categoryFor(ref) {
        const name = String(ref ?? '').trim().toLowerCase();
        return categories.find(c => c.toLowerCase() === name);
      }

      const items = data.items
        .filter(i => i && typeof i.name === 'string')
        .map(i => ({
          id: newId(),
          name: i.name,
          qty: amountOrOne(i.qty),
          added: /^\d{4}-\d{2}-\d{2}$/.test(i.added) ? i.added : undefined,
          freezer: freezerFor(i.freezer),
          category: categoryFor(i.category),
        }));

      return { freezers, categories, items };
    }

    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function byName(a, b) {
      return a.localeCompare(b);
    }

    // The freezer being viewed, or null for the "All" view.
    function currentFreezer() {
      if (freezers.length === 1) return freezers[0];
      return freezers.find(f => f.id === current) || null;
    }

    // The same thing frozen on the same day, in the same freezer and category, shares one row.
    function findMatch(like) {
      return items.find(item =>
        item.freezer === like.freezer && item.added === like.added &&
        item.category === like.category &&
        item.name.toLowerCase() === like.name.toLowerCase()
      );
    }

    // Changes an item's freezer or category, folding it into a matching row if there is one.
    function moveItem(item, key, value) {
      const moved = { ...item, [key]: value || undefined };
      const existing = findMatch(moved);
      if (existing && existing !== item) {
        existing.qty = roundAmount(existing.qty + item.qty);
        items = items.filter(i => i !== item);
      } else {
        Object.assign(item, moved);
      }
    }

    // Reads amounts like "2", "1.5", "1,5", "1/2" or "1 1/2" (NaN if it can't).
    function parseAmount(value) {
      const text = String(value ?? '').trim().replace(',', '.');
      const fraction = text.match(/^(?:(\d+)\s+)?(\d+)\/(\d+)$/);
      const n = fraction
        ? Number(fraction[1] || 0) + fraction[2] / fraction[3]
        : text ? Number(text) : NaN;
      return Number.isFinite(n) ? roundAmount(n) : NaN;
    }

    function amountOrOne(value) {
      const n = parseAmount(value);
      return n > 0 ? n : 1;
    }

    // Two decimal places is plenty, and stops 0.1 + 0.2 showing up as 0.30000000000000004.
    function roundAmount(n) {
      return Math.round(n * 100) / 100;
    }

    function things(n) {
      n = roundAmount(n);
      return `${n} thing${n === 1 ? '' : 's'}`;
    }

    // Dates are stored as local "YYYY-MM-DD" strings to avoid timezone drift.
    function today() {
      const d = new Date();
      return [d.getFullYear(), d.getMonth() + 1, d.getDate()]
        .map(n => String(n).padStart(2, '0'))
        .join('-');
    }

    function parseDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function daysSince(dateStr) {
      return Math.round((parseDate(today()) - parseDate(dateStr)) / 86400000);
    }

    function formatDate(dateStr) {
      const date = parseDate(dateStr);
      const options = { month: 'short', day: 'numeric' };
      if (date.getFullYear() !== new Date().getFullYear()) options.year = 'numeric';
      return date.toLocaleDateString(undefined, options);
    }

    function ago(days) {
      if (days <= 0) return 'today';
      if (days === 1) return 'yesterday';
      if (days < 14) return `${days} days ago`;
      if (days < 60) return `${Math.floor(days / 7)} weeks ago`;
      return `${Math.floor(days / 30)} months ago`;
    }

    function render() {
      const freezer = currentFreezer();
      renderTabs(freezer);

      const inView = freezer ? items.filter(i => i.freezer === freezer.id) : items;
      const query = search.value.trim().toLowerCase();
      const shown = inView
        .filter(item => item.name.toLowerCase().includes(query))
        // Undated items sort first: they were probably in there before tracking started.
        .sort((a, b) => (a.added || '').localeCompare(b.added || ''));

      // Only what's on screen stays selected, so bulk actions never touch hidden items.
      for (const id of selected) if (!shown.some(i => i.id === id)) selected.delete(id);

      // Group by category, with uncategorized things last. Headings only
      // show up once something has a category.
      const groups = [...categories, undefined]
        .map(category => ({ category, rows: shown.filter(i => i.category === category) }))
        .filter(group => group.rows.length);
      const headings = groups.some(group => group.category);
      list.replaceChildren(...groups.flatMap(group => [
        ...(headings ? [renderHeading(group.category ?? 'No category')] : []),
        ...group.rows.map(renderItem),
      ]));

      const total = inView.reduce((sum, item) => sum + item.qty, 0);
      const where = freezer ? freezer.name : `${freezers.length} freezers`;
      summary.textContent = total ? `${things(total)} in ${where}, oldest first.` : '';

      // Only the "All" view needs to ask which freezer new items go in.
      freezerSelect.hidden = !!freezer;
      const chosenFreezer = freezerSelect.value;
      freezerSelect.replaceChildren(...freezers.map(f => new Option(f.name, f.id)));
      if (freezers.some(f => f.id === chosenFreezer)) freezerSelect.value = chosenFreezer;

      if (!categories.includes(formCategory)) formCategory = '';
      categorySelect.replaceChildren(
        new Option('No category', ''),
        ...categories.map(c => new Option(c, c)),
        newCategoryOption,
      );
      categorySelect.value = formCategory;

      categoryChips.replaceChildren(...categories.map(renderChip), addCategoryButton);

      // The bulk bar shows up once anything is ticked.
      document.body.classList.toggle('has-selection', selected.size > 0);
      bulkBar.hidden = !selected.size;
      selectedCount.textContent = `${selected.size} selected`;
      bulkCategory.replaceChildren(
        placeholder('Set category…'),
        new Option('No category', ''),
        ...categories.map(c => new Option(c, c)),
      );
      bulkMove.replaceChildren(placeholder('Move to…'), ...freezers.map(f => new Option(f.name, f.id)));
      bulkCategory.parentElement.hidden = !categories.length;
      bulkMove.parentElement.hidden = freezers.length < 2;

      empty.hidden = shown.length > 0;
      empty.textContent = inView.length
        ? 'Nothing matches that search.'
        : 'Nothing in here yet. Add something above.';
    }

    function renderTabs(active) {
      const buttons = freezers.length > 1 ? [tabButton('All', 'all', !active)] : [];
      for (const f of freezers) buttons.push(f === active ? freezerMenu(f) : tabButton(f.name, f.id, false));
      tabs.replaceChildren(...buttons, addFreezerButton);
    }

    // The open freezer's tab, with a menu for renaming or deleting it.
    function freezerMenu(freezer) {
      const tab = document.createElement('label');
      tab.className = 'tab-menu';
      tab.textContent = freezer.name;
      const menu = document.createElement('select');
      menu.setAttribute('aria-label', `${freezer.name} options`);
      menu.append(placeholder(freezer.name), new Option('Rename…', 'rename'));
      if (freezers.length > 1) menu.append(new Option('Delete…', 'delete'));
      tab.append(menu);
      return tab;
    }

    function tabButton(label, id, pressed) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      button.dataset.freezer = id;
      button.setAttribute('aria-pressed', pressed);
      return button;
    }

    function renderHeading(text) {
      const li = document.createElement('li');
      li.className = 'group';
      li.textContent = text;
      return li;
    }

    function placeholder(text) {
      const option = new Option(text, '', true, true);
      option.disabled = true;
      return option;
    }

    function renderChip(category) {
      const chip = chipTemplate.content.firstElementChild.cloneNode(true);
      chip.dataset.category = category;
      chip.querySelector('.rename').textContent = category;
      chip.querySelector('.remove').setAttribute('aria-label', `Delete ${category}`);
      return chip;
    }

    function renderItem(item) {
      const li = rowTemplate.content.firstElementChild.cloneNode(true);
      const old = Boolean(item.added) && daysSince(item.added) >= OLD_AFTER_DAYS;
      const details = item.added
        ? [formatDate(item.added), ago(daysSince(item.added))]
        : ['No date'];
      if (old) details.push('use soon');

      li.dataset.id = item.id;
      li.classList.toggle('old', old);
      li.classList.toggle('selected', selected.has(item.id));
      const check = li.querySelector('.check');
      check.checked = selected.has(item.id);
      check.setAttribute('aria-label', `Select ${item.name}`);
      li.querySelector('.name').textContent = item.name;
      li.querySelector('.details').textContent = details.join(' · ');
      const count = li.querySelector('.n');
      count.value = item.qty;
      count.setAttribute('aria-label', `How many ${item.name}`);

      // Freezer and category dropdowns show the current value and start on it.
      const freezerPick = li.querySelector('.freezer-pick');
      if (freezers.length > 1) {
        freezerPick.append(...freezers.map(f => new Option(f.name, f.id)));
        freezerPick.value = item.freezer;
        freezerPick.previousElementSibling.textContent = freezerPick.selectedOptions[0].text;
      } else {
        freezerPick.parentElement.remove();
      }
      const categoryPick = li.querySelector('.category-pick');
      if (categories.length) {
        categoryPick.append(new Option('No category', ''), ...categories.map(c => new Option(c, c)));
        categoryPick.value = item.category ?? '';
        categoryPick.previousElementSibling.textContent = item.category ?? 'Add category';
      } else {
        categoryPick.parentElement.remove();
      }

      // At 1 or less, minus would empty it, so it becomes a remove button.
      if (item.qty <= 1) {
        const dec = li.querySelector('.dec');
        dec.textContent = '×';
        dec.title = 'Remove';
        dec.setAttribute('aria-label', `Remove ${item.name}`);
      }
      return li;
    }

    // Asks for a name and returns the category, reusing one that already exists.
    function addCategory() {
      const name = prompt('New category name')?.trim();
      if (!name) return null;
      const existing = categories.find(c => c.toLowerCase() === name.toLowerCase());
      if (existing) return existing;
      categories.push(name);
      categories.sort(byName);
      return name;
    }

    function renameCategory(old) {
      const name = prompt('Rename category', old)?.trim();
      if (!name || name === old) return;
      // Renaming to a category that already exists merges the two.
      const existing = categories.find(c => c !== old && c.toLowerCase() === name.toLowerCase());
      const target = existing || name;
      categories = existing
        ? categories.filter(c => c !== old)
        : categories.map(c => (c === old ? name : c)).sort(byName);
      for (const item of items) if (item.category === old) item.category = target;
      if (formCategory === old) formCategory = target;
    }

    function deleteCategory(category) {
      const count = items
        .filter(i => i.category === category)
        .reduce((sum, i) => sum + i.qty, 0);
      const question = count
        ? `Delete ${category}? The ${things(count)} in it will have no category.`
        : `Delete ${category}?`;
      if (!confirm(question)) return;
      categories = categories.filter(c => c !== category);
      for (const item of items) if (item.category === category) item.category = undefined;
    }

    tabs.addEventListener('click', event => {
      const id = event.target.closest('[data-freezer]')?.dataset.freezer;
      if (!id) return;
      setCurrent(id);
      if (id !== 'all') freezerSelect.value = id;
      render();
    });

    addFreezerButton.addEventListener('click', () => {
      const name = prompt('Name the new freezer (e.g. Garage)')?.trim();
      if (!name) return;
      const freezer = { id: newId(), name };
      freezers.push(freezer);
      setCurrent(freezer.id);
      save();
    });

    tabs.addEventListener('change', event => {
      const freezer = currentFreezer();
      if (event.target.value === 'rename') {
        const name = prompt('Rename this freezer', freezer.name)?.trim();
        if (name) freezer.name = name;
      } else if (event.target.value === 'delete') {
        const count = items
          .filter(i => i.freezer === freezer.id)
          .reduce((sum, i) => sum + i.qty, 0);
        const question = count
          ? `Delete ${freezer.name} and the ${things(count)} in it?`
          : `Delete ${freezer.name}?`;
        if (confirm(question)) {
          freezers = freezers.filter(f => f !== freezer);
          items = items.filter(i => i.freezer !== freezer.id);
          setCurrent('all');
        }
      }
      save(); // also resets the menu if it was cancelled
    });

    categorySelect.addEventListener('change', () => {
      formCategory = categorySelect.selectedOptions[0] === newCategoryOption
        ? addCategory() ?? formCategory
        : categorySelect.value;
      save();
    });

    categoryChips.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      const category = button.closest('.chip')?.dataset.category;
      if (button === addCategoryButton) addCategory();
      else if (button.classList.contains('remove')) deleteCategory(category);
      else renameCategory(category);
      save();
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      const name = nameInput.value.trim();
      if (!name) return;
      const qty = amountOrOne(qtyInput.value);
      const added = dateInput.value || today();
      const freezer = currentFreezer()?.id ?? freezerSelect.value;
      const category = formCategory || undefined;

      const existing = findMatch({ name, added, freezer, category });
      if (existing) existing.qty = roundAmount(existing.qty + qty);
      else items.push({ id: newId(), name, qty, added, freezer, category });

      save();
      nameInput.value = '';
      qtyInput.value = 1;
      nameInput.focus();
    });

    list.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      const item = items.find(i => i.id === button.closest('li').dataset.id);
      item.qty = roundAmount(item.qty + (button.classList.contains('inc') ? 1 : -1));
      if (item.qty <= 0) items = items.filter(i => i !== item);
      save();
    });

    list.addEventListener('change', event => {
      const field = event.target;
      if (!field.matches('.check, .n, .freezer-pick, .category-pick')) return;
      const item = items.find(i => i.id === field.closest('li').dataset.id);

      if (field.matches('.check')) {
        if (field.checked) selected.add(item.id);
        else selected.delete(item.id);
        render();
        return;
      }

      if (field.matches('.n')) {
        // 0 removes the item; anything that isn't a number puts the old count back.
        const qty = parseAmount(field.value);
        if (qty === 0) items = items.filter(i => i !== item);
        else if (qty > 0) item.qty = qty;
      } else {
        moveItem(item, field.matches('.freezer-pick') ? 'freezer' : 'category', field.value);
      }
      save();
    });

    // Tapping a count selects it so typing replaces it; Enter saves.
    list.addEventListener('focusin', event => {
      if (event.target.matches('.n')) event.target.select();
    });
    list.addEventListener('keydown', event => {
      if (event.key === 'Enter' && event.target.matches('.n')) event.target.blur();
    });

    search.addEventListener('input', render);

    document.getElementById('bulk-clear').addEventListener('click', () => {
      selected.clear();
      render();
    });

    // Bulk actions untick everything once they're done.
    bulkBar.addEventListener('change', event => {
      const key = event.target === bulkMove ? 'freezer' : 'category';
      for (const item of items.filter(i => selected.has(i.id))) moveItem(item, key, event.target.value);
      selected.clear();
      save();
    });

    bulkRemove.addEventListener('click', () => {
      const n = selected.size;
      if (!confirm(`Remove ${n} selected item${n === 1 ? '' : 's'}?`)) return;
      items = items.filter(i => !selected.has(i.id));
      selected.clear();
      save();
    });

    document.getElementById('export').addEventListener('click', () => {
      // Item ids only matter while the page is open, so backups leave them out.
      const backup = JSON.stringify(
        { freezers, categories, items: items.map(({ id, ...item }) => item) },
        null,
        2
      );
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([backup], { type: 'application/json' }));
      link.download = `freezer-vault-${today()}.json`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    });

    document.getElementById('import').addEventListener('click', () => importFile.click());

    importFile.addEventListener('change', async () => {
      const file = importFile.files[0];
      importFile.value = '';
      if (!file) return;
      let imported;
      try {
        imported = normalize(JSON.parse(await file.text()));
      } catch {
        alert("That file doesn't look like a Freezer Vault backup.");
        return;
      }
      const n = imported.freezers.length;
      const question = `Replace everything with ${imported.items.length} items ` +
        `in ${n} freezer${n === 1 ? '' : 's'} from this backup?`;
      if (confirm(question)) {
        ({ freezers, categories, items } = imported);
        setCurrent('all');
        save();
      }
    });

    dateInput.value = today();
    render();
  </script>
</body>
</html>
